<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatami Labs - 日本職人・工芸家データベース・協力分析システム</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 50%, #CD853F 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.3rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .overview-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #8B4513;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #6b7280;
            font-weight: 500;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        .sidebar {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .filter-section {
            margin-bottom: 30px;
        }

        .filter-section h3 {
            color: #8B4513;
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95rem;
        }

        .filter-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #8B4513;
            box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.1);
        }

        .region-map {
            background: #f8fafc;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .region-map h4 {
            color: #8B4513;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .region-list {
            display: grid;
            gap: 8px;
        }

        .region-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #D2691E;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .region-item:hover {
            background: #fef7ed;
            transform: translateX(5px);
        }

        .region-name {
            font-weight: 600;
            color: #1f2937;
        }

        .region-count {
            background: #D2691E;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .results-section {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f3f4f6;
        }

        .results-title {
            color: #8B4513;
            font-weight: 700;
            font-size: 1.8rem;
        }

        .sort-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .sort-btn {
            padding: 8px 16px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .sort-btn.active {
            background: #8B4513;
            color: white;
            border-color: #8B4513;
        }

        .craftsman-card {
            background: linear-gradient(135deg, #fef7ed 0%, #fed7aa 100%);
            border-radius: 20px;
            padding: 35px;
            margin-bottom: 30px;
            border-left: 6px solid #8B4513;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .craftsman-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(139, 69, 19, 0.15);
        }

        .craftsman-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, rgba(139, 69, 19, 0.1) 0%, transparent 100%);
            border-radius: 0 0 0 150px;
        }

        .craftsman-header {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .craftsman-basic {
            z-index: 10;
            position: relative;
        }

        .craftsman-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: #8B4513;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .craft-type {
            color: #D2691E;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .workshop-name {
            color: #6b7280;
            font-style: italic;
            font-size: 0.95rem;
        }

        .heritage-badge {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            white-space: nowrap;
        }

        .match-score {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            font-weight: 700;
            min-width: 140px;
        }

        .match-score .score-value {
            font-size: 2.5rem;
            display: block;
            line-height: 1;
        }

        .match-score .score-label {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        .craftsman-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .detail-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #f3f4f6;
            text-align: center;
        }

        .detail-icon {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .detail-label {
            font-size: 0.85rem;
            color: #6b7280;
        }

        .contact-section {
            background: #e0f2fe;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .contact-title {
            color: #0277bd;
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .contact-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .contact-item {
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #03a9f4;
            color: #374151;
            font-size: 0.9rem;
        }

        .contact-item strong {
            color: #0277bd;
            display: block;
            margin-bottom: 4px;
        }

        .specialty-section {
            background: linear-gradient(135deg, #e0f2fe 0%, #b3e5fc 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .specialty-title {
            color: #0277bd;
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .specialty-description {
            color: #01579b;
            line-height: 1.6;
            font-size: 1rem;
        }

        @media (max-width: 1400px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .overview-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .craftsman-header {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .craftsman-details {
                grid-template-columns: repeat(2, 1fr);
            }
            .contact-info {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container" x-data="craftsmanDatabase()">
        <div class="header">
            <h1>🏺 Tatami Labs 日本職人・工芸家データベース</h1>
            <p>Tatami Labs パートナー発見・評価システム - 伝統工芸士 × 現代起業家</p>
        </div>

        <!-- Overview Statistics -->
        <div class="overview-stats">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value" x-text="totalStats.craftsmen"></div>
                <div class="stat-label">登録職人総数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🗾</div>
                <div class="stat-value" x-text="totalStats.regions"></div>
                <div class="stat-label">対応都道府県</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎨</div>
                <div class="stat-value" x-text="totalStats.craftTypes"></div>
                <div class="stat-label">工芸種類</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-value" x-text="totalStats.avgExperience"></div>
                <div class="stat-label">平均経験年数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🤝</div>
                <div class="stat-value" x-text="totalStats.cooperationReady"></div>
                <div class="stat-label">協力準備済み</div>
            </div>
        </div>

        <div class="main-content">
            <!-- Sidebar with Filters and Regional Map -->
            <div class="sidebar">
                <div class="filter-section">
                    <h3>🔍 フィルター条件</h3>
                    
                    <div class="filter-group">
                        <label>工芸種類</label>
                        <select x-model="filters.craftType" @change="applyFilters()">
                            <option value="">全ての工芸</option>
                            <optgroup label="伝統工芸">
                                <option value="pottery">陶磁工芸 (陶芸)</option>
                                <option value="textile">織物工芸 (織物)</option>
                                <option value="woodwork">木工芸 (木工)</option>
                                <option value="lacquerware">漆器工芸 (漆芸)</option>
                                <option value="metalwork">金属工芸 (金工)</option>
                                <option value="papercraft">和紙工芸 (紙漉き)</option>
                                <option value="glasswork">ガラス工芸 (ガラス工芸)</option>
                                <option value="bamboo">竹工芸 (竹工芸)</option>
                                <option value="knife">刃物工芸</option>
                                <option value="doll">人形工芸</option>
                            </optgroup>
                            <optgroup label="現代革新工芸">
                                <option value="modern-design">モダンデザイン工芸</option>
                                <option value="sustainable-craft">持続可能工芸</option>
                                <option value="tech-craft">テクノロジー工芸</option>
                                <option value="lifestyle-brand">ライフスタイルブランド</option>
                                <option value="food-craft">フードクラフト</option>
                                <option value="wellness-craft">ウェルネスクラフト</option>
                                <option value="digital-traditional">デジタル伝統工芸</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>経験年数</label>
                        <select x-model="filters.experience" @change="applyFilters()">
                            <option value="">すべての経験</option>
                            <option value="5-15">5-15年</option>
                            <option value="15-25">15-25年</option>
                            <option value="25-35">25-35年</option>
                            <option value="35+">35年以上</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>協力意向</label>
                        <select x-model="filters.cooperationWillingness" @change="applyFilters()">
                            <option value="">すべての意向</option>
                            <option value="high">高い意向</option>
                            <option value="medium">中程度の意向</option>
                            <option value="low">様子見姿勢</option>
                        </select>
                    </div>
                </div>

                <!-- Regional Distribution -->
                <div class="region-map">
                    <h4>📍 地理的分布</h4>
                    <div class="region-list">
                        <template x-for="region in regionStats" :key="region.name">
                            <div class="region-item" @click="filterByRegion(region.code)">
                                <span class="region-name" x-text="region.name"></span>
                                <span class="region-count" x-text="region.count + '人'"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div class="results-section">
                <div class="results-header">
                    <h2 class="results-title">🏆 職人プロフィール・協力評価</h2>
                    <div class="sort-controls">
                        <button class="sort-btn" :class="{ active: sortBy === 'score' }" @click="sortCraftsmen('score')">
                            協力スコア順
                        </button>
                        <button class="sort-btn" :class="{ active: sortBy === 'experience' }" @click="sortCraftsmen('experience')">
                            経験年数順
                        </button>
                        <button class="sort-btn" :class="{ active: sortBy === 'location' }" @click="sortCraftsmen('location')">
                            地域順
                        </button>
                    </div>
                </div>

                <div x-show="filteredCraftsmen.length > 0">
                    <template x-for="(craftsman, index) in filteredCraftsmen" :key="index">
                        <div class="craftsman-card">
                            <!-- Header Section -->
                            <div class="craftsman-header">
                                <div class="craftsman-basic">
                                    <div class="craftsman-name" x-text="craftsman.name"></div>
                                    <div class="craft-type" x-text="craftsman.craftTypeDisplay"></div>
                                    <div class="workshop-name" x-text="craftsman.workshop"></div>
                                </div>
                                <div class="heritage-badge" x-text="craftsman.heritage"></div>
                                <div class="match-score">
                                    <span class="score-value" x-text="craftsman.cooperationScore"></span>
                                    <span class="score-label">協力指数</span>
                                </div>
                            </div>

                            <!-- Details Grid -->
                            <div class="craftsman-details">
                                <div class="detail-card">
                                    <div class="detail-icon">📍</div>
                                    <div class="detail-value" x-text="craftsman.location"></div>
                                    <div class="detail-label">工房所在地</div>
                                </div>
                                <div class="detail-card">
                                    <div class="detail-icon">⏰</div>
                                    <div class="detail-value" x-text="craftsman.experience + '年'"></div>
                                    <div class="detail-label">工芸経験</div>
                                </div>
                                <div class="detail-card">
                                    <div class="detail-icon">💰</div>
                                    <div class="detail-value" x-text="craftsman.priceRange"></div>
                                    <div class="detail-label">作品価格</div>
                                </div>
                                <div class="detail-card">
                                    <div class="detail-icon">🌐</div>
                                    <div class="detail-value" x-text="getDigitalStatusDisplay(craftsman.digitalStatus)"></div>
                                    <div class="detail-label">デジタル化度</div>
                                </div>
                            </div>

                            <!-- Contact Section -->
                            <div class="contact-section" x-show="craftsman.contact">
                                <div class="contact-title">📞 連絡先情報</div>
                                <div class="contact-info">
                                    <div class="contact-item" x-show="craftsman.contact && craftsman.contact.phone">
                                        <strong>電話番号</strong>
                                        <span x-text="craftsman.contact ? craftsman.contact.phone : ''"></span>
                                    </div>
                                    <div class="contact-item" x-show="craftsman.contact && craftsman.contact.email">
                                        <strong>メール</strong>
                                        <span x-text="craftsman.contact ? craftsman.contact.email : ''"></span>
                                    </div>
                                    <div class="contact-item" x-show="craftsman.contact && craftsman.contact.website">
                                        <strong>ウェブサイト</strong>
                                        <span x-text="craftsman.contact ? craftsman.contact.website : ''"></span>
                                    </div>
                                </div>
                            </div>

                            <!-- Specialty Section -->
                            <div class="specialty-section">
                                <div class="specialty-title">🎯 専門分野</div>
                                <div class="specialty-description" x-text="craftsman.specialtyDescription"></div>
                            </div>
                        </div>
                    </template>
                </div>

                <div x-show="filteredCraftsmen.length === 0" style="text-align: center; padding: 60px; color: #6b7280;">
                    <h3>😔 条件に一致する職人が見つかりません</h3>
                    <p>フィルター条件を調整してください</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function craftsmanDatabase() {
            return {
                filters: {
                    craftType: '',
                    experience: '',
                    cooperationWillingness: '',
                    region: ''
                },
                sortBy: 'score',
                allCraftsmen: [],
                filteredCraftsmen: [],
                totalStats: {
                    craftsmen: 0,
                    regions: 0,
                    craftTypes: 0,
                    avgExperience: 0,
                    cooperationReady: 0
                },
                regionStats: [],

                init() {
                    this.allCraftsmen = this.loadCraftsmenDatabase();
                    this.calculateStats();
                    this.applyFilters();
                    // 默认按合作评分排序（从高到低）
                    this.sortCraftsmen('score');
                },

                loadCraftsmenDatabase() {
                    // 生成300个工匠数据的示例
                    const craftsmen = [];
                    
                    // 传统工艺师 (200个)
                    const traditionalCrafts = [
                        {type: 'pottery', display: '陶磁工芸 (陶芸)', regions: ['kyoto', 'gifu', 'saga', 'aichi']},
                        {type: 'textile', display: '織物工芸 (織物)', regions: ['kyoto', 'yamagata', 'ehime', 'gunma']},
                        {type: 'woodwork', display: '木工芸 (木工)', regions: ['gifu', 'akita', 'nagano', 'iwate']},
                        {type: 'lacquerware', display: '漆器工芸 (漆芸)', regions: ['ishikawa', 'fukushima', 'wakayama', 'kyoto']},
                        {type: 'metalwork', display: '金属工芸 (金工)', regions: ['niigata', 'iwate', 'kochi', 'tokyo']},
                        {type: 'papercraft', display: '和紙工芸 (紙漉き)', regions: ['fukui', 'nara', 'kochi', 'gifu']},
                        {type: 'glasswork', display: 'ガラス工芸', regions: ['tokyo', 'toyama', 'chiba', 'okinawa']},
                        {type: 'bamboo', display: '竹工芸', regions: ['oita', 'kyoto', 'kumamoto', 'shizuoka']},
                        {type: 'knife', display: '刃物工芸', regions: ['kochi', 'sakai', 'tsubame', 'seki']},
                        {type: 'doll', display: '人形工芸', regions: ['kyoto', 'hiroshima', 'sendai', 'kanazawa']}
                    ];

                    // 现代工艺创业者 (100个)
                    const modernCrafts = [
                        {type: 'modern-design', display: 'モダンデザイン工芸'},
                        {type: 'sustainable-craft', display: '持続可能工芸'},
                        {type: 'tech-craft', display: 'テクノロジー工芸'},
                        {type: 'lifestyle-brand', display: 'ライフスタイルブランド'},
                        {type: 'food-craft', display: 'フードクラフト'},
                        {type: 'wellness-craft', display: 'ウェルネスクラフト'},
                        {type: 'digital-traditional', display: 'デジタル伝統工芸'}
                    ];

                    const regions = {
                        'kyoto': '京都府',
                        'tokyo': '東京都',
                        'osaka': '大阪府',
                        'kanagawa': '神奈川県',
                        'aichi': '愛知県',
                        'fukuoka': '福岡県',
                        'sapporo': '北海道',
                        'sendai': '宮城県',
                        'hiroshima': '広島県',
                        'shizuoka': '静岡県',
                        'niigata': '新潟県',
                        'kumamoto': '熊本県',
                        'kagoshima': '鹿児島県',
                        'okinawa': '沖縄県',
                        'ishikawa': '石川県',
                        'gifu': '岐阜県',
                        'nara': '奈良県',
                        'wakayama': '和歌山県',
                        'fukui': '福井県',
                        'toyama': '富山県',
                        'yamagata': '山形県',
                        'akita': '秋田県',
                        'iwate': '岩手県',
                        'fukushima': '福島県',
                        'gunma': '群馬県',
                        'chiba': '千葉県',
                        'kochi': '高知県',
                        'ehime': '愛媛県',
                        'saga': '佐賀県',
                        'oita': '大分県',
                        'nagano': '長野県',
                        'sakai': '大阪府堺市',
                        'tsubame': '新潟県燕市',
                        'seki': '岐阜県関市',
                        'kanazawa': '石川県金沢市'
                    };

                    const surnames = ['田中', '佐藤', '鈴木', '高橋', '渡辺', '伊藤', '山田', '中村', '小林', '加藤', '吉田', '山本', '石川', '前田', '藤田', '後藤', '岡田', '長谷川', '村上', '近藤', '石田', '齋藤', '宮本', '福田', '西村', '松本', '井上', '木村', '林', '清水', '山崎', '池田', '阿部', '森', '橋本', '山下', '石井', '斎藤', '坂本', '新井', '松田', '中島', '藤井', '西田', '原田', '青木', '岩崎', '竹内', '菊地', '酒井'];
                    const givenNames = ['和夫', '一郎', '次郎', '三郎', '太郎', '健一', '誠', '博', '実', '茂', '清', '進', '勇', '明', '正', '裕', '治', '武', '修', '学', '豊', '功', '剛', '栄', '光', '智', '信', '努', '勝', '孝', '恵子', '美智子', '裕子', '直子', '幸子', '久美子', '雅子', '美穂', '真理', '由美', '美紀', '香織', '麻衣', '理恵', '智子', '恵美', '亜希子', '沙織', '美咲', '真理子', '由紀'];

                    // 生成传统工艺师
                    let id = 1;
                    traditionalCrafts.forEach(craft => {
                        const numCraftsmen = Math.floor(200 / traditionalCrafts.length) + (Math.random() > 0.5 ? 1 : 0);
                        for (let i = 0; i < numCraftsmen; i++) {
                            const surname = surnames[Math.floor(Math.random() * surnames.length)];
                            const givenName = givenNames[Math.floor(Math.random() * givenNames.length)];
                            const regionKeys = Object.keys(regions);
                            const selectedRegion = regionKeys[Math.floor(Math.random() * regionKeys.length)];
                            const experience = Math.floor(Math.random() * 35) + 10;
                            const cooperationScore = Math.floor(Math.random() * 25) + 70;
                            
                            const phoneArea = Math.floor(Math.random() * 9000) + 1000;
                            const phoneNumber = Math.floor(Math.random() * 900000) + 100000;
                            
                            craftsmen.push({
                                id: id++,
                                name: `${surname}${givenName} (${surname} ${givenName})`,
                                craftType: craft.type,
                                craftTypeDisplay: craft.display,
                                location: regions[selectedRegion],
                                region: selectedRegion,
                                experience: experience,
                                digitalStatus: ['low', 'medium', 'high'][Math.floor(Math.random() * 3)],
                                cooperationWillingness: ['low', 'medium', 'high'][Math.floor(Math.random() * 3)],
                                priceRange: `¥${Math.floor(Math.random() * 15000) + 3000}-${Math.floor(Math.random() * 80000) + 20000}`,
                                workshop: `${surname}${craft.display.split(' ')[0]}工房`,
                                heritage: experience > 30 ? '名人級職人' : experience > 20 ? '熟練職人' : '新進職人',
                                contact: {
                                    phone: `0${Math.floor(Math.random() * 9) + 1}-${phoneArea}-${phoneNumber}`,
                                    email: `${surname.toLowerCase()}@${craft.type}-${selectedRegion}.jp`,
                                    website: Math.random() > 0.3 ? `www.${surname.toLowerCase()}-${craft.type}.com` : null
                                },
                                specialtyDescription: `${craft.display}の伝統技法を継承し、${experience}年の経験を持つ職人。地域の特色を活かした作品作りを行っています。`,
                                cooperationScore: cooperationScore,
                                metrics: {
                                    salesPotential: Math.floor(Math.random() * 30) + 70,
                                    exposureNeed: Math.floor(Math.random() * 30) + 70,
                                    internationalReady: Math.floor(Math.random() * 40) + 60,
                                    productFit: Math.floor(Math.random() * 25) + 75
                                }
                            });
                        }
                    });

                    // 生成现代创业者
                    modernCrafts.forEach(craft => {
                        const numCraftsmen = Math.floor(100 / modernCrafts.length) + (Math.random() > 0.5 ? 1 : 0);
                        for (let i = 0; i < numCraftsmen; i++) {
                            const surname = surnames[Math.floor(Math.random() * surnames.length)];
                            const givenName = givenNames[Math.floor(Math.random() * givenNames.length)];
                            const regionKeys = ['tokyo', 'osaka', 'kyoto', 'kanagawa', 'aichi', 'fukuoka', 'sapporo'];
                            const selectedRegion = regionKeys[Math.floor(Math.random() * regionKeys.length)];
                            const experience = Math.floor(Math.random() * 12) + 3;
                            const cooperationScore = Math.floor(Math.random() * 20) + 80;
                            
                            const phoneArea = Math.floor(Math.random() * 9000) + 1000;
                            const phoneNumber = Math.floor(Math.random() * 900000) + 100000;
                            
                            craftsmen.push({
                                id: id++,
                                name: `${surname}${givenName} (${surname} ${givenName})`,
                                craftType: craft.type,
                                craftTypeDisplay: craft.display,
                                location: regions[selectedRegion],
                                region: selectedRegion,
                                experience: experience,
                                digitalStatus: ['medium', 'high'][Math.floor(Math.random() * 2)],
                                cooperationWillingness: ['medium', 'high'][Math.floor(Math.random() * 2)],
                                priceRange: `¥${Math.floor(Math.random() * 20000) + 5000}-${Math.floor(Math.random() * 150000) + 30000}`,
                                workshop: `${surname} ${craft.display} STUDIO`,
                                heritage: '革新的クリエイター',
                                contact: {
                                    phone: `0${Math.floor(Math.random() * 9) + 1}-${phoneArea}-${phoneNumber}`,
                                    email: `${surname.toLowerCase()}@${craft.type.replace('-', '')}.jp`,
                                    website: `www.${surname.toLowerCase()}-${craft.type.replace('-', '')}.com`
                                },
                                specialtyDescription: `${craft.display}分野で革新的な取り組みを行う新世代のクリエイター。伝統と現代技術を融合した作品を制作しています。`,
                                cooperationScore: cooperationScore,
                                metrics: {
                                    salesPotential: Math.floor(Math.random() * 25) + 75,
                                    exposureNeed: Math.floor(Math.random() * 30) + 70,
                                    internationalReady: Math.floor(Math.random() * 25) + 75,
                                    productFit: Math.floor(Math.random() * 30) + 70
                                }
                            });
                        }
                    });

                    return craftsmen.slice(0, 300); // 确保正好300个
                },

                calculateStats() {
                    const craftsmen = this.allCraftsmen;
                    this.totalStats.craftsmen = craftsmen.length;
                    this.totalStats.regions = new Set(craftsmen.map(c => c.region)).size;
                    this.totalStats.craftTypes = new Set(craftsmen.map(c => c.craftType)).size;
                    this.totalStats.avgExperience = Math.round(
                        craftsmen.reduce((sum, c) => sum + c.experience, 0) / craftsmen.length
                    );
                    this.totalStats.cooperationReady = craftsmen.filter(c => 
                        c.cooperationScore >= 85 && c.cooperationWillingness === 'high'
                    ).length;

                    // Calculate regional stats
                    const regionMap = {};
                    craftsmen.forEach(c => {
                        if (!regionMap[c.region]) {
                            regionMap[c.region] = { count: 0, name: this.getRegionName(c.region), code: c.region };
                        }
                        regionMap[c.region].count++;
                    });
                    this.regionStats = Object.values(regionMap).sort((a, b) => b.count - a.count);
                },

                applyFilters() {
                    let filtered = [...this.allCraftsmen];

                    if (this.filters.craftType) {
                        filtered = filtered.filter(c => c.craftType === this.filters.craftType);
                    }

                    if (this.filters.experience) {
                        filtered = filtered.filter(c => this.matchesExperience(c.experience, this.filters.experience));
                    }

                    if (this.filters.cooperationWillingness) {
                        filtered = filtered.filter(c => c.cooperationWillingness === this.filters.cooperationWillingness);
                    }

                    if (this.filters.region) {
                        filtered = filtered.filter(c => c.region === this.filters.region);
                    }

                    this.filteredCraftsmen = filtered;
                    this.sortCraftsmen(this.sortBy);
                },

                matchesExperience(experience, filter) {
                    switch(filter) {
                        case '5-15': return experience >= 5 && experience <= 15;
                        case '15-25': return experience >= 15 && experience <= 25;
                        case '25-35': return experience >= 25 && experience <= 35;
                        case '35+': return experience >= 35;
                        default: return true;
                    }
                },

                sortCraftsmen(criteria) {
                    this.sortBy = criteria;
                    switch(criteria) {
                        case 'score':
                            this.filteredCraftsmen.sort((a, b) => b.cooperationScore - a.cooperationScore);
                            break;
                        case 'experience':
                            this.filteredCraftsmen.sort((a, b) => b.experience - a.experience);
                            break;
                        case 'location':
                            this.filteredCraftsmen.sort((a, b) => a.location.localeCompare(b.location, 'ja'));
                            break;
                    }
                },

                filterByRegion(regionCode) {
                    this.filters.region = this.filters.region === regionCode ? '' : regionCode;
                    this.applyFilters();
                },

                getRegionName(code) {
                    const regions = {
                        'kyoto': '京都府',
                        'tokyo': '東京都',
                        'osaka': '大阪府',
                        'kanagawa': '神奈川県',
                        'aichi': '愛知県',
                        'fukuoka': '福岡県',
                        'sapporo': '北海道',
                        'sendai': '宮城県',
                        'hiroshima': '広島県',
                        'shizuoka': '静岡県',
                        'niigata': '新潟県',
                        'kumamoto': '熊本県',
                        'kagoshima': '鹿児島県',
                        'okinawa': '沖縄県',
                        'ishikawa': '石川県',
                        'gifu': '岐阜県',
                        'nara': '奈良県',
                        'wakayama': '和歌山県',
                        'fukui': '福井県',
                        'toyama': '富山県',
                        'yamagata': '山形県',
                        'akita': '秋田県',
                        'iwate': '岩手県',
                        'fukushima': '福島県',
                        'gunma': '群馬県',
                        'chiba': '千葉県',
                        'kochi': '高知県',
                        'ehime': '愛媛県',
                        'saga': '佐賀県',
                        'oita': '大分県',
                        'nagano': '長野県',
                        'sakai': '大阪府',
                        'tsubame': '新潟県',
                        'seki': '岐阜県',
                        'kanazawa': '石川県'
                    };
                    return regions[code] || code;
                },

                getDigitalStatusDisplay(status) {
                    const displays = {
                        'high': '高度デジタル化',
                        'medium': '部分デジタル化',
                        'low': '伝統的手法'
                    };
                    return displays[status] || status;
                }
            }
        }
    </script>
