<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#3A3D42" rx="24"/>
  
  <!-- Green Square (back) -->
  <g transform="translate(256,256) rotate(8) translate(-100,-100)">
    <rect x="0" y="0" width="200" height="200" 
          fill="none" 
          stroke="#9DB09A" 
          stroke-width="12" 
          rx="16"/>
  </g>
  
  <!-- Beige Square (front) -->
  <g transform="translate(256,256) rotate(-8) translate(-100,-100)">
    <rect x="0" y="0" width="200" height="200" 
          fill="rgba(245, 243, 239, 0.3)" 
          stroke="#F5F3EF" 
          stroke-width="12" 
          rx="16"/>
  </g>
  
  <!-- Text -->
  <text x="256" y="420" 
        text-anchor="middle" 
        fill="#F5F3EF" 
        font-family="serif" 
        font-size="36" 
        font-weight="400">
    Tatami Labs
  </text>
</svg>