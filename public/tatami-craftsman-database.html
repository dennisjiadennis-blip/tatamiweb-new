<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatami Labs - 日本職人・工芸家データベース・協力分析システム</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #8B4513 0%, #D2691E 50%, #CD853F 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 900;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.3rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .overview-stats {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .stat-value {
            font-size: 2.2rem;
            font-weight: 700;
            color: #8B4513;
            margin-bottom: 8px;
        }

        .stat-label {
            color: #6b7280;
            font-weight: 500;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        .sidebar {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .filter-section {
            margin-bottom: 30px;
        }

        .filter-section h3 {
            color: #8B4513;
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 1.2rem;
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 0.95rem;
        }

        .filter-group select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #8B4513;
            box-shadow: 0 0 0 3px rgba(139, 69, 19, 0.1);
        }

        .region-map {
            background: #f8fafc;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .region-map h4 {
            color: #8B4513;
            margin-bottom: 15px;
            font-weight: 700;
        }

        .region-list {
            display: grid;
            gap: 8px;
        }

        .region-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: white;
            border-radius: 8px;
            border-left: 4px solid #D2691E;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .region-item:hover {
            background: #fef7ed;
            transform: translateX(5px);
        }

        .region-name {
            font-weight: 600;
            color: #1f2937;
        }

        .region-count {
            background: #D2691E;
            color: white;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .results-section {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f3f4f6;
        }

        .results-title {
            color: #8B4513;
            font-weight: 700;
            font-size: 1.8rem;
        }

        .sort-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .sort-btn {
            padding: 8px 16px;
            border: 2px solid #e5e7eb;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .sort-btn.active {
            background: #8B4513;
            color: white;
            border-color: #8B4513;
        }

        .craftsman-card {
            background: linear-gradient(135deg, #fef7ed 0%, #fed7aa 100%);
            border-radius: 20px;
            padding: 35px;
            margin-bottom: 30px;
            border-left: 6px solid #8B4513;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .craftsman-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(139, 69, 19, 0.15);
        }

        .craftsman-card::before {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 150px;
            background: linear-gradient(45deg, rgba(139, 69, 19, 0.1) 0%, transparent 100%);
            border-radius: 0 0 0 150px;
        }

        .craftsman-header {
            display: grid;
            grid-template-columns: 1fr auto auto;
            gap: 20px;
            align-items: flex-start;
            margin-bottom: 25px;
        }

        .craftsman-basic {
            z-index: 10;
            position: relative;
        }

        .craftsman-name {
            font-size: 1.8rem;
            font-weight: 700;
            color: #8B4513;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .craft-type {
            color: #D2691E;
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .workshop-name {
            color: #6b7280;
            font-style: italic;
            font-size: 0.95rem;
        }

        .heritage-badge {
            background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-weight: 600;
            font-size: 0.9rem;
            text-align: center;
            white-space: nowrap;
        }

        .match-score {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            font-weight: 700;
            min-width: 140px;
        }

        .match-score .score-value {
            font-size: 2.5rem;
            display: block;
            line-height: 1;
        }

        .match-score .score-label {
            font-size: 0.85rem;
            opacity: 0.9;
            margin-top: 5px;
        }

        .craftsman-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .detail-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            border: 2px solid #f3f4f6;
            text-align: center;
        }

        .detail-icon {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }

        .detail-value {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 5px;
        }

        .detail-label {
            font-size: 0.85rem;
            color: #6b7280;
        }

        .specialty-section {
            background: linear-gradient(135deg, #e0f2fe 0%, #b3e5fc 100%);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .specialty-title {
            color: #0277bd;
            font-weight: 700;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }

        .specialty-description {
            color: #01579b;
            line-height: 1.6;
            font-size: 1rem;
        }

        .awards-section {
            background: #f0fdf4;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        .awards-title {
            color: #059669;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .awards-list {
            display: grid;
            gap: 8px;
        }

        .award-item {
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            border-left: 4px solid #10b981;
            color: #374151;
            font-size: 0.95rem;
        }

        .cooperation-analysis {
            background: linear-gradient(135deval, #dbeafe 0%, #bfdbfe 100%);
            padding: 25px;
            border-radius: 15px;
        }

        .cooperation-title {
            color: #1d4ed8;
            font-weight: 700;
            margin-bottom: 20px;
            font-size: 1.2rem;
        }

        .potential-metrics {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #e0e7ff;
        }

        .metric-score {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1d4ed8;
        }

        .metric-label {
            font-size: 0.8rem;
            color: #6b7280;
            margin-top: 5px;
        }

        .cooperation-reasons {
            background: white;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #3b82f6;
        }

        .reasons-title {
            color: #1d4ed8;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .reasons-list {
            list-style: none;
            display: grid;
            gap: 10px;
        }

        .reason-item {
            background: #f8fafc;
            padding: 12px 16px;
            border-radius: 8px;
            color: #374151;
            border-left: 3px solid #3b82f6;
        }

        @media (max-width: 1400px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .overview-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .craftsman-header {
                grid-template-columns: 1fr;
                gap: 15px;
            }
            .craftsman-details {
                grid-template-columns: repeat(2, 1fr);
            }
            .potential-metrics {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container" x-data="craftsmanDatabase()">
        <div class="header">
            <h1>🏺 Tatami Labs 日本職人・工芸家データベース</h1>
            <p>Tatami Labs パートナー発見・評価システム - 伝統工芸士 × 現代起業家</p>
        </div>

        <!-- Overview Statistics -->
        <div class="overview-stats">
            <div class="stat-card">
                <div class="stat-icon">👥</div>
                <div class="stat-value" x-text="totalStats.craftsmen"></div>
                <div class="stat-label">登録職人総数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🗾</div>
                <div class="stat-value" x-text="totalStats.regions"></div>
                <div class="stat-label">対応都道府県</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🎨</div>
                <div class="stat-value" x-text="totalStats.craftTypes"></div>
                <div class="stat-label">工芸種類</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">⭐</div>
                <div class="stat-value" x-text="totalStats.avgExperience"></div>
                <div class="stat-label">平均経験年数</div>
            </div>
            <div class="stat-card">
                <div class="stat-icon">🤝</div>
                <div class="stat-value" x-text="totalStats.cooperationReady"></div>
                <div class="stat-label">協力準備済み</div>
            </div>
        </div>

        <div class="main-content">
            <!-- Sidebar with Filters and Regional Map -->
            <div class="sidebar">
                <div class="filter-section">
                    <h3>🔍 フィルター条件</h3>
                    
                    <div class="filter-group">
                        <label>工芸種類</label>
                        <select x-model="filters.craftType" @change="applyFilters()">
                            <option value="">全ての工芸</option>
                            <optgroup label="伝統工芸">
                                <option value="pottery">陶磁工芸 (陶芸)</option>
                                <option value="textile">織物工芸 (織物)</option>
                                <option value="woodwork">木工芸 (木工)</option>
                                <option value="lacquerware">漆器工芸 (漆芸)</option>
                                <option value="metalwork">金属工芸 (金工)</option>
                                <option value="papercraft">和紙工芸 (紙漉き)</option>
                                <option value="glasswork">ガラス工芸 (ガラス工芸)</option>
                                <option value="bamboo">竹工芸 (竹工芸)</option>
                            </optgroup>
                            <optgroup label="現代革新工芸">
                                <option value="modern-design">モダンデザイン工芸</option>
                                <option value="sustainable-craft">持続可能工芸</option>
                                <option value="tech-craft">テクノロジー工芸</option>
                                <option value="lifestyle-brand">ライフスタイルブランド</option>
                                <option value="food-craft">フードクラフト</option>
                                <option value="wellness-craft">ウェルネスクラフト</option>
                                <option value="digital-traditional">デジタル伝統工芸</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>経験年数</label>
                        <select x-model="filters.experience" @change="applyFilters()">
                            <option value="">すべての経験</option>
                            <option value="10-20">10-20年</option>
                            <option value="20-30">20-30年</option>
                            <option value="30-40">30-40年</option>
                            <option value="40+">40年以上</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <label>協力意向</label>
                        <select x-model="filters.cooperationWillingness" @change="applyFilters()">
                            <option value="">すべての意向</option>
                            <option value="high">高い意向</option>
                            <option value="medium">中程度の意向</option>
                            <option value="low">様子見姿勢</option>
                        </select>
                    </div>
                </div>

                <!-- Regional Distribution -->
                <div class="region-map">
                    <h4>📍 地理的分布</h4>
                    <div class="region-list">
                        <template x-for="region in regionStats" :key="region.name">
                            <div class="region-item" @click="filterByRegion(region.code)">
                                <span class="region-name" x-text="region.name"></span>
                                <span class="region-count" x-text="region.count + '人'"></span>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

            <!-- Results Section -->
            <div class="results-section">
                <div class="results-header">
                    <h2 class="results-title">🏆 職人プロファイル・協力評価</h2>
                    <div class="sort-controls">
                        <button class="sort-btn" :class="{ active: sortBy === 'score' }" @click="sortCraftsmen('score')">
                            協力スコア順
                        </button>
                        <button class="sort-btn" :class="{ active: sortBy === 'experience' }" @click="sortCraftsmen('experience')">
                            経験年数順
                        </button>
                        <button class="sort-btn" :class="{ active: sortBy === 'location' }" @click="sortCraftsmen('location')">
                            地域順
                        </button>
                    </div>
                </div>

                <div x-show="filteredCraftsmen.length > 0">
                    <template x-for="(craftsman, index) in filteredCraftsmen" :key="index">
                        <div class="craftsman-card">
                            <!-- Header Section -->
                            <div class="craftsman-header">
                                <div class="craftsman-basic">
                                    <div class="craftsman-name" x-text="craftsman.name"></div>
                                    <div class="craft-type" x-text="craftsman.craftTypeDisplay"></div>
                                    <div class="workshop-name" x-text="craftsman.workshop"></div>
                                </div>
                                <div class="heritage-badge" x-text="craftsman.heritage"></div>
                                <div class="match-score">
                                    <span class="score-value" x-text="craftsman.cooperationScore"></span>
                                    <span class="score-label">協力指数</span>
                                </div>
                            </div>

                            <!-- Details Grid -->
                            <div class="craftsman-details">
                                <div class="detail-card">
                                    <div class="detail-icon">📍</div>
                                    <div class="detail-value" x-text="craftsman.location"></div>
                                    <div class="detail-label">工房所在地</div>
                                </div>
                                <div class="detail-card">
                                    <div class="detail-icon">⏰</div>
                                    <div class="detail-value" x-text="craftsman.experience + '年'"></div>
                                    <div class="detail-label">工芸経験</div>
                                </div>
                                <div class="detail-card">
                                    <div class="detail-icon">💰</div>
                                    <div class="detail-value" x-text="craftsman.priceRange"></div>
                                    <div class="detail-label">作品価格</div>
                                </div>
                                <div class="detail-card">
                                    <div class="detail-icon">🌐</div>
                                    <div class="detail-value" x-text="getDigitalStatusDisplay(craftsman.digitalStatus)"></div>
                                    <div class="detail-label">デジタル化度</div>
                                </div>
                            </div>

                            <!-- Specialty Section -->
                            <div class="specialty-section">
                                <div class="specialty-title">🎯 専門分野</div>
                                <div class="specialty-description" x-text="craftsman.specialtyDescription"></div>
                            </div>

                            <!-- Awards Section -->
                            <div class="awards-section" x-show="craftsman.awards && craftsman.awards.length > 0">
                                <div class="awards-title">🏆 主な受賞歴</div>
                                <div class="awards-list">
                                    <template x-for="award in craftsman.awards" :key="award">
                                        <div class="award-item" x-text="award"></div>
                                    </template>
                                </div>
                            </div>

                            <!-- Cooperation Analysis -->
                            <div class="cooperation-analysis">
                                <div class="cooperation-title">🤝 Tatami Labs 協力ポテンシャル分析</div>
                                
                                <div class="potential-metrics">
                                    <div class="metric-item">
                                        <div class="metric-score" x-text="craftsman.metrics.salesPotential"></div>
                                        <div class="metric-label">売上向上ポテンシャル</div>
                                    </div>
                                    <div class="metric-item">
                                        <div class="metric-score" x-text="craftsman.metrics.exposureNeed"></div>
                                        <div class="metric-label">ネット露出ニーズ</div>
                                    </div>
                                    <div class="metric-item">
                                        <div class="metric-score" x-text="craftsman.metrics.internationalReady"></div>
                                        <div class="metric-label">国際化準備度</div>
                                    </div>
                                    <div class="metric-item">
                                        <div class="metric-score" x-text="craftsman.metrics.productFit"></div>
                                        <div class="metric-label">製品マッチ度</div>
                                    </div>
                                </div>

                                <div class="cooperation-reasons">
                                    <div class="reasons-title">💡 協力を推薦するコア理由</div>
                                    <ul class="reasons-list">
                                        <template x-for="reason in craftsman.cooperationReasons" :key="reason">
                                            <li class="reason-item" x-text="reason"></li>
                                        </template>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>

                <div x-show="filteredCraftsmen.length === 0" style="text-align: center; padding: 60px; color: #6b7280;">
                    <h3>😔 条件に一致する職人が見つかりません</h3>
                    <p>フィルター条件を調整してください</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function craftsmanDatabase() {
            return {
                filters: {
                    craftType: '',
                    experience: '',
                    cooperationWillingness: '',
                    region: ''
                },
                sortBy: 'score',
                allCraftsmen: [],
                filteredCraftsmen: [],
                totalStats: {
                    craftsmen: 0,
                    regions: 0,
                    craftTypes: 0,
                    avgExperience: 0,
                    cooperationReady: 0
                },
                regionStats: [],

                init() {
                    this.allCraftsmen = this.loadCraftsmenDatabase();
                    this.calculateStats();
                    this.applyFilters();
                    // 默认按合作评分排序（从高到低）
                    this.sortCraftsmen('score');
                },

                loadCraftsmenDatabase() {
                    return [
                        {
                            name: '田中和夫 (Tanaka Kazuo)',
                            craftType: 'pottery',
                            craftTypeDisplay: '陶瓷工艺 (陶芸)',
                            location: '京都府信楽町',
                            locationDisplay: '京都府信楽町 (Shigaraki, Kyoto)',
                            region: 'kyoto',
                            experience: 35,
                            digitalStatus: 'low',
                            cooperationWillingness: 'high',
                            priceRange: '¥8,000-25,000',
                            workshop: '田中陶芸工房 (Tanaka Pottery Studio)',
                            heritage: '三代目工匠',
                            specialtyDescription: '专精信楽焼茶器制作，传承三代的独特釉药配方，擅长制作日常茶道用具。作品以自然朴素的美感著称，深受茶道爱好者喜爱。',
                            awards: [
                                '京都府伝統工芸品展 優秀賞 (2019)',
                                '日本陶芸展 入選 (2020)',
                                '信楽焼陶芸の里 会長賞 (2021)'
                            ],
                            cooperationScore: 92,
                            metrics: {
                                salesPotential: 95,
                                exposureNeed: 98,
                                internationalReady: 88,
                                productFit: 87
                            },

                calculateStats() {
                    const craftsmen = this.allCraftsmen;
                    this.totalStats.craftsmen = craftsmen.length;
                    this.totalStats.regions = new Set(craftsmen.map(c => c.region)).size;
                    this.totalStats.craftTypes = new Set(craftsmen.map(c => c.craftType)).size;
                    this.totalStats.avgExperience = Math.round(
                        craftsmen.reduce((sum, c) => sum + c.experience, 0) / craftsmen.length
                    );
                    this.totalStats.cooperationReady = craftsmen.filter(c => 
                        c.cooperationScore >= 85 && c.cooperationWillingness === 'high'
                    ).length;

                    // Calculate regional stats
                    const regionMap = {};
                    craftsmen.forEach(c => {
                        if (!regionMap[c.region]) {
                            regionMap[c.region] = { count: 0, name: this.getRegionName(c.region), code: c.region };
                        }
                        regionMap[c.region].count++;
                    });
                    this.regionStats = Object.values(regionMap).sort((a, b) => b.count - a.count);
                },

                applyFilters() {
                    let filtered = [...this.allCraftsmen];

                    if (this.filters.craftType) {
                        filtered = filtered.filter(c => c.craftType === this.filters.craftType);
                    }

                    if (this.filters.experience) {
                        filtered = filtered.filter(c => this.matchesExperience(c.experience, this.filters.experience));
                    }

                    if (this.filters.cooperationWillingness) {
                        filtered = filtered.filter(c => c.cooperationWillingness === this.filters.cooperationWillingness);
                    }

                    if (this.filters.region) {
                        filtered = filtered.filter(c => c.region === this.filters.region);
                    }

                    this.filteredCraftsmen = filtered;
                    this.sortCraftsmen(this.sortBy);
                },

                matchesExperience(experience, filter) {
                    switch(filter) {
                        case '10-20': return experience >= 10 && experience <= 20;
                        case '20-30': return experience >= 20 && experience <= 30;
                        case '30-40': return experience >= 30 && experience <= 40;
                        case '40+': return experience >= 40;
                        default: return true;
                    }
                },

                sortCraftsmen(criteria) {
                    this.sortBy = criteria;
                    switch(criteria) {
                        case 'score':
                            this.filteredCraftsmen.sort((a, b) => b.cooperationScore - a.cooperationScore);
                            break;
                        case 'experience':
                            this.filteredCraftsmen.sort((a, b) => b.experience - a.experience);
                            break;
                        case 'location':
                            this.filteredCraftsmen.sort((a, b) => a.location.localeCompare(b.location, 'ja'));
                            break;
                    }
                },

                filterByRegion(regionCode) {
                    this.filters.region = this.filters.region === regionCode ? '' : regionCode;
                    this.applyFilters();
                },

                getRegionName(code) {
                    const regions = {
                        'kyoto': '京都府',
                        'gifu': '岐阜県', 
                        'kanazawa': '石川県',
                        'niigata': '新潟県',
                        'tokyo': '東京都',
                        'kyushu': '九州地区',
                        'osaka': '大阪府',
                        'shizuoka': '静岡県',
                        'nagano': '長野県',
                        'tohoku': '東北地区',
                        'hokuriku': '北陸地区',
                        'hokkaido': '北海道',
                        'chubu': '中部地区',
                        'okinawa': '沖縄県',
                        'shikoku': '四国地区',
                        'chugoku': '中国地区',
                        'kansai': '関西地区',
                        'kanto': '関東地区'
                    };
                    return regions[code] || code;
                },

                getDigitalStatusDisplay(status) {
                    const displays = {
                        'high': '高度デジタル化',
                        'medium': '部分デジタル化',
                        'low': '伝統的手法'
                    };
                    return displays[status] || status;
                }
            }
        }
