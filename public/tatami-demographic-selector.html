<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatami Labs - 智能选品推荐系统</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            align-items: start;
        }

        .input-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 1rem;
        }

        .input-group select,
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .input-group select:focus,
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .analyze-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .analyze-btn:active {
            transform: translateY(0);
        }

        .results-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            min-height: 600px;
        }

        .recommendation-card {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
        }

        .recommendation-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .product-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .product-category {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .product-description {
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .score-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .score-item {
            background: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            border: 2px solid #f1f5f9;
        }

        .score-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: #667eea;
            display: block;
        }

        .score-label {
            font-size: 0.85rem;
            color: #64748b;
            margin-top: 5px;
        }

        .total-score {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-size: 2rem;
            font-weight: 900;
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .reasons-list {
            background: #f8fafc;
            border-radius: 12px;
            padding: 20px;
            margin-top: 15px;
        }

        .reasons-list h4 {
            color: #1e293b;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .reasons-list ul {
            list-style: none;
        }

        .reasons-list li {
            background: white;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 4px solid #10b981;
            color: #374151;
        }

        .no-results {
            text-align: center;
            color: #64748b;
            font-style: italic;
            margin-top: 50px;
        }

        .demographic-summary {
            background: linear-gradient(135deg, #fef3c7 0%, #fbbf24 100%);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
            color: #92400e;
        }

        .demographic-summary h3 {
            margin-bottom: 15px;
            color: #78350f;
        }

        .demographic-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .score-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container" x-data="demographicSelector()">
        <div class="header">
            <h1>🎯 Tatami Labs 智能选品推荐系统</h1>
            <p>基于消费者画像的日本产品智能推荐</p>
        </div>

        <div class="main-content">
            <!-- Input Section -->
            <div class="input-section">
                <h2 style="margin-bottom: 25px; color: #1e293b; font-weight: 700;">消费者画像输入</h2>
                
                <div class="input-group">
                    <label for="region">📍 目标地域</label>
                    <select id="region" x-model="demographics.region">
                        <option value="">请选择地域</option>
                        <option value="china-tier1">中国一线城市 (北上广深)</option>
                        <option value="china-tier2">中国二线城市</option>
                        <option value="china-tier3">中国三四线城市</option>
                        <option value="japan-urban">日本都市圈</option>
                        <option value="japan-rural">日本地方城市</option>
                        <option value="southeast-asia">东南亚发达地区</option>
                        <option value="north-america">北美地区</option>
                        <option value="europe">欧洲发达地区</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="price-range">💰 客单价范围 (人民币)</label>
                    <select id="price-range" x-model="demographics.priceRange">
                        <option value="">请选择价格区间</option>
                        <option value="50-200">¥50 - ¥200 (入门级)</option>
                        <option value="200-500">¥200 - ¥500 (中档)</option>
                        <option value="500-1000">¥500 - ¥1,000 (中高档)</option>
                        <option value="1000-2000">¥1,000 - ¥2,000 (高档)</option>
                        <option value="2000-5000">¥2,000 - ¥5,000 (奢华)</option>
                        <option value="5000+">¥5,000+ (顶级)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="age-group">👥 目标年龄段</label>
                    <select id="age-group" x-model="demographics.ageGroup">
                        <option value="">请选择年龄段</option>
                        <option value="18-25">18-25岁 (Z世代)</option>
                        <option value="26-35">26-35岁 (年轻白领)</option>
                        <option value="36-45">36-45岁 (中产家庭)</option>
                        <option value="46-55">46-55岁 (成熟消费者)</option>
                        <option value="55+">55岁以上 (银发族)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="gender">⚥ 主要性别</label>
                    <select id="gender" x-model="demographics.gender">
                        <option value="">请选择主要性别</option>
                        <option value="female">女性为主 (70%+)</option>
                        <option value="male">男性为主 (70%+)</option>
                        <option value="balanced">性别均衡</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="lifestyle">🏠 生活方式</label>
                    <select id="lifestyle" x-model="demographics.lifestyle">
                        <option value="">请选择生活方式</option>
                        <option value="urban-professional">都市白领</option>
                        <option value="family-oriented">家庭导向</option>
                        <option value="wellness-focused">健康养生</option>
                        <option value="luxury-seeker">品质追求</option>
                        <option value="tech-savvy">科技潮流</option>
                        <option value="traditional">传统文化</option>
                    </select>
                </div>

                <button class="analyze-btn" @click="analyzeProfile()" :disabled="!canAnalyze">
                    🔍 智能推荐分析
                </button>
            </div>

            <!-- Results Section -->
            <div class="results-section">
                <h2 style="margin-bottom: 25px; color: #1e293b; font-weight: 700;">推荐结果</h2>

                <!-- Show demographic summary if analysis is done -->
                <div x-show="analyzed" class="demographic-summary">
                    <h3>📊 目标客群画像</h3>
                    <div class="demographic-item">
                        <span>目标地域:</span>
                        <span x-text="getRegionLabel(demographics.region)"></span>
                    </div>
                    <div class="demographic-item">
                        <span>客单价:</span>
                        <span x-text="demographics.priceRange"></span>
                    </div>
                    <div class="demographic-item">
                        <span>年龄段:</span>
                        <span x-text="demographics.ageGroup"></span>
                    </div>
                    <div class="demographic-item">
                        <span>性别倾向:</span>
                        <span x-text="getGenderLabel(demographics.gender)"></span>
                    </div>
                    <div class="demographic-item">
                        <span>生活方式:</span>
                        <span x-text="getLifestyleLabel(demographics.lifestyle)"></span>
                    </div>
                </div>

                <!-- Recommendations -->
                <div x-show="recommendations.length > 0">
                    <template x-for="(product, index) in recommendations" :key="index">
                        <div class="recommendation-card">
                            <div class="product-name" x-text="product.name"></div>
                            <div class="product-category" x-text="product.category"></div>
                            <div class="product-description" x-text="product.description"></div>
                            
                            <div class="total-score">
                                总评分: <span x-text="product.totalScore"></span>/70
                            </div>

                            <div class="score-container">
                                <div class="score-item">
                                    <span class="score-value" x-text="product.scores.japanMade"></span>
                                    <div class="score-label">🇯🇵 日本制造</div>
                                </div>
                                <div class="score-item">
                                    <span class="score-value" x-text="product.scores.durability"></span>
                                    <div class="score-label">♻️ 耐用性</div>
                                </div>
                                <div class="score-item">
                                    <span class="score-value" x-text="product.scores.priceReasonable"></span>
                                    <div class="score-label">💰 价格合理</div>
                                </div>
                                <div class="score-item">
                                    <span class="score-value" x-text="product.scores.personalization"></span>
                                    <div class="score-label">✏️ 个性化</div>
                                </div>
                                <div class="score-item">
                                    <span class="score-value" x-text="product.scores.repeatPurchase"></span>
                                    <div class="score-label">🔄 复购</div>
                                </div>
                                <div class="score-item">
                                    <span class="score-value" x-text="product.scores.socialMedia"></span>
                                    <div class="score-label">📱 社交传播</div>
                                </div>
                                <div class="score-item">
                                    <span class="score-value" x-text="product.scores.targetAudience"></span>
                                    <div class="score-label">🎯 目标明确</div>
                                </div>
                            </div>

                            <div class="reasons-list">
                                <h4>💡 推荐理由:</h4>
                                <ul>
                                    <template x-for="reason in product.reasons" :key="reason">
                                        <li x-text="reason"></li>
                                    </template>
                                </ul>
                            </div>
                        </div>
                    </template>
                </div>

                <div x-show="analyzed && recommendations.length === 0" class="no-results">
                    <h3>😔 暂无匹配推荐</h3>
                    <p>请尝试调整消费者画像参数</p>
                </div>

                <div x-show="!analyzed" class="no-results">
                    <h3>👆 请完善消费者画像</h3>
                    <p>填写左侧表单开始智能推荐</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function demographicSelector() {
            return {
                demographics: {
                    region: '',
                    priceRange: '',
                    ageGroup: '',
                    gender: '',
                    lifestyle: ''
                },
                analyzed: false,
                recommendations: [],

                get canAnalyze() {
                    return this.demographics.region && 
                           this.demographics.priceRange && 
                           this.demographics.ageGroup && 
                           this.demographics.gender && 
                           this.demographics.lifestyle;
                },

                analyzeProfile() {
                    if (!this.canAnalyze) return;
                    
                    this.analyzed = true;
                    this.recommendations = this.generateRecommendations();
                },

                generateRecommendations() {
                    const productDatabase = this.getProductDatabase();
                    const recommendations = [];

                    // 基于人口统计学数据评估每个产品
                    productDatabase.forEach(product => {
                        // 首先检查地域适配
                        if (!this.isRegionCompatible(product)) {
                            return; // 跳过不适配的地域产品
                        }
                        
                        const scores = this.calculateProductScores(product);
                        const totalScore = Object.values(scores).reduce((sum, score) => sum + score, 0);
                        
                        // 动态阈值：根据最佳匹配度设定
                        const matchScore = this.calculateDemographicMatch(product);
                        if (matchScore >= 75) { // 提高匹配阈值到75分
                            recommendations.push({
                                ...product,
                                scores: scores,
                                totalScore: totalScore,
                                matchScore: matchScore,
                                reasons: this.generateReasons(product, scores)
                            });
                        }
                    });

                    // 按匹配度严格排序
                    const sortedRecommendations = recommendations
                        .sort((a, b) => {
                            // 首先按匹配度排序
                            if (b.matchScore !== a.matchScore) {
                                return b.matchScore - a.matchScore;
                            }
                            // 如果匹配度相同，按总分排序
                            return b.totalScore - a.totalScore;
                        });
                    
                    // 如果匹配度最高的产品少于80分，说明匹配度不够高
                    if (sortedRecommendations.length > 0 && sortedRecommendations[0].matchScore < 80) {
                        console.log('最高匹配度:', sortedRecommendations[0].matchScore, '产品数量:', sortedRecommendations.length);
                    }
                    
                    return sortedRecommendations.slice(0, 3); // 只返回前3个最佳匹配
                },

                calculateProductScores(product) {
                    const scores = {
                        japanMade: 0,
                        durability: 0,
                        priceReasonable: 0,
                        personalization: 0,
                        repeatPurchase: 0,
                        socialMedia: 0,
                        targetAudience: 0
                    };

                    // 日本制造评分 (固定10分，所有产品都是日本制造)
                    scores.japanMade = 10;

                    // 耐用性评分
                    scores.durability = product.durabilityScore || 8;

                    // 价格合理性评分
                    scores.priceReasonable = this.calculatePriceScore(product);

                    // 个性化潜力评分
                    scores.personalization = this.calculatePersonalizationScore(product);

                    // 复购潜力评分
                    scores.repeatPurchase = this.calculateRepeatPurchaseScore(product);

                    // 社交传播力评分
                    scores.socialMedia = this.calculateSocialMediaScore(product);

                    // 目标客群明确性评分
                    scores.targetAudience = this.calculateTargetAudienceScore(product);

                    return scores;
                },

                calculatePriceScore(product) {
                    const priceRange = this.demographics.priceRange;
                    const productPrice = product.priceRange;
                    
                    // 价格区间匹配度
                    if (priceRange === productPrice) return 10;
                    
                    // 相邻价格区间
                    const priceOrder = ['50-200', '200-500', '500-1000', '1000-2000', '2000-5000', '5000+'];
                    const targetIndex = priceOrder.indexOf(priceRange);
                    const productIndex = priceOrder.indexOf(productPrice);
                    
                    if (Math.abs(targetIndex - productIndex) === 1) return 7;
                    if (Math.abs(targetIndex - productIndex) === 2) return 4;
                    
                    return 2;
                },

                isRegionCompatible(product) {
                    const region = this.demographics.region;
                    const compatibleRegions = product.compatibleRegions || [];
                    
                    // 如果产品没有地域限制，则适用于所有地域
                    if (compatibleRegions.length === 0) return true;
                    
                    // 严格地域匹配
                    return compatibleRegions.includes(region);
                },

                calculateDemographicMatch(product) {
                    let matchScore = 0;
                    const maxScore = 100;
                    
                    // 价格匹配 (30分) - 提高权重
                    if (this.demographics.priceRange === product.priceRange) {
                        matchScore += 30;
                    } else {
                        const priceOrder = ['50-200', '200-500', '500-1000', '1000-2000', '2000-5000', '5000+'];
                        const targetIndex = priceOrder.indexOf(this.demographics.priceRange);
                        const productIndex = priceOrder.indexOf(product.priceRange);
                        const distance = Math.abs(targetIndex - productIndex);
                        if (distance === 1) matchScore += 15;
                        else if (distance === 2) matchScore += 5;
                        // 距离超过2个价格区间的产品得0分
                    }
                    
                    // 性别匹配 (25分) - 提高权重
                    if (product.targetGender === this.demographics.gender) {
                        matchScore += 25;
                    } else if (product.targetGender === 'balanced' && this.demographics.gender !== '') {
                        matchScore += 8; // 降低balanced的分数
                    }
                    
                    // 年龄匹配 (25分) - 必须精确匹配
                    if (product.targetAge && product.targetAge.includes(this.demographics.ageGroup)) {
                        matchScore += 25;
                    } else {
                        // 年龄不匹配直接扣分
                        matchScore -= 10;
                    }
                    
                    // 生活方式匹配 (20分) - 必须精确匹配
                    if (product.targetLifestyle && product.targetLifestyle.includes(this.demographics.lifestyle)) {
                        matchScore += 20;
                    } else {
                        // 生活方式不匹配扣分
                        matchScore -= 5;
                    }
                    
                    // 地域适配检查 - 不匹配直接排除
                    if (!this.isRegionCompatible(product)) {
                        return 0; // 地域不匹配直接返回0分
                    }
                    
                    return Math.max(0, matchScore); // 确保不会出现负分
                },

                calculatePersonalizationScore(product) {
                    const ageGroup = this.demographics.ageGroup;
                    const lifestyle = this.demographics.lifestyle;
                    
                    let score = product.personalizationBase || 3; // 降低基础分
                    
                    // 年龄段匹配加分
                    if (product.targetAge && product.targetAge.includes(ageGroup)) {
                        score += 4;
                    }
                    
                    // 生活方式匹配加分
                    if (product.targetLifestyle && product.targetLifestyle.includes(lifestyle)) {
                        score += 3;
                    }
                    
                    return Math.min(score, 10);
                },

                calculateRepeatPurchaseScore(product) {
                    let score = product.repeatPurchaseBase || 5;
                    
                    // 消耗品加分
                    if (product.isConsumable) score += 3;
                    
                    // 收藏价值加分
                    if (product.isCollectable) score += 2;
                    
                    // 礼品属性加分
                    if (product.isGiftable) score += 2;
                    
                    return Math.min(score, 10);
                },

                calculateSocialMediaScore(product) {
                    const ageGroup = this.demographics.ageGroup;
                    let score = product.socialMediaBase || 5;
                    
                    // 年轻群体社交传播力更强
                    if (['18-25', '26-35'].includes(ageGroup)) {
                        score += 3;
                    } else if (['36-45'].includes(ageGroup)) {
                        score += 1;
                    }
                    
                    // 视觉冲击力加分
                    if (product.visualAppeal) score += 2;
                    
                    return Math.min(score, 10);
                },

                calculateTargetAudienceScore(product) {
                    let score = 2; // 降低基础分
                    
                    // 性别匹配
                    if (product.targetGender === this.demographics.gender) {
                        score += 4;
                    } else if (product.targetGender === 'balanced') {
                        score += 2;
                    }
                    
                    // 年龄段匹配
                    if (product.targetAge && product.targetAge.includes(this.demographics.ageGroup)) {
                        score += 4;
                    }
                    
                    return Math.min(score, 10);
                },

                generateReasons(product, scores) {
                    const reasons = [];
                    
                    if (scores.priceReasonable >= 8) {
                        reasons.push(`价格区间与目标客群完美匹配 (${this.demographics.priceRange})`);
                    }
                    
                    if (scores.targetAudience >= 8) {
                        reasons.push(`高度符合目标客群特征 (${this.getGenderLabel(this.demographics.gender)}, ${this.demographics.ageGroup})`);
                    }
                    
                    // 添加匹配度说明
                    if (product.matchScore >= 90) {
                        reasons.push('🎯 完美匹配您的消费者画像');
                    } else if (product.matchScore >= 80) {
                        reasons.push('✅ 高度匹配您的需求特征');
                    }
                    
                    if (scores.socialMedia >= 8) {
                        reasons.push('具备强大的社交媒体传播潜力');
                    }
                    
                    if (scores.repeatPurchase >= 8) {
                        reasons.push('优秀的复购和生态构建能力');
                    }
                    
                    if (scores.personalization >= 8) {
                        reasons.push(`高个性化潜力，适合${this.getLifestyleLabel(this.demographics.lifestyle)}群体`);
                    }
                    
                    reasons.push('日本原产品质保障，符合消费升级趋势');
                    
                    return reasons;
                },

                getProductDatabase() {
                    // 基于人口统计学的日本产品数据库
