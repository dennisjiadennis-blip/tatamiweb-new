<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatami Labs - 实时热门选品推荐系统</title>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/instagram-api-integration.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .realtime-badge {
            display: inline-flex;
            align-items: center;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-top: 10px;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            align-items: start;
        }

        .input-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }

        .trending-section {
            background: linear-gradient(135deg, #fef3c7 0%, #f59e0b 100%);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            color: #92400e;
        }

        .trending-title {
            font-weight: 700;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .trending-title .icon {
            margin-right: 8px;
            font-size: 1.2rem;
        }

        .trending-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .trending-tag {
            background: rgba(255,255,255,0.8);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .input-group {
            margin-bottom: 25px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 1rem;
        }

        .input-group select,
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: white;
        }

        .input-group select:focus,
        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .analyze-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .analyze-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.3);
        }

        .analyze-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            min-height: 700px;
        }

        .recommendation-card {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
            border-left: 5px solid #667eea;
            transition: all 0.3s ease;
        }

        .recommendation-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .product-name {
            font-size: 1.4rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 10px;
        }

        .product-category {
            color: #667eea;
            font-weight: 600;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .trend-indicators {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }

        .trend-indicator {
            display: flex;
            align-items: center;
            background: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .trend-indicator.hot {
            color: #dc2626;
            border: 2px solid #fecaca;
        }

        .trend-indicator.rising {
            color: #059669;
            border: 2px solid #a7f3d0;
        }

        .trend-indicator.viral {
            color: #7c3aed;
            border: 2px solid #ddd6fe;
        }

        .instagram-stats {
            background: linear-gradient(135deg, #fdf4ff 0%, #e879f9 100%);
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
        }

        .instagram-stats h4 {
            color: #86198f;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat-item {
            text-align: center;
            background: rgba(255,255,255,0.8);
            padding: 8px;
            border-radius: 8px;
        }

        .stat-value {
            font-weight: 700;
            font-size: 1.1rem;
            color: #86198f;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #a21caf;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: #64748b;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container" x-data="realtimeSelector()">
        <div class="header">
            <h1>🔥 Tatami Labs 实时热门选品系统</h1>
            <p>基于Instagram实时数据的智能产品推荐</p>
            <div class="realtime-badge">
                <div class="pulse"></div>
                实时数据同步中
            </div>
        </div>

        <div class="main-content">
            <!-- Input Section -->
            <div class="input-section">
                <h2 style="margin-bottom: 25px; color: #1e293b; font-weight: 700;">消费者画像 + 实时趋势</h2>
                
                <!-- Trending Section -->
                <div class="trending-section">
                    <div class="trending-title">
                        <span class="icon">📈</span>
                        Instagram热门趋势 (实时)
                    </div>
                    <div class="trending-tags">
                        <template x-for="tag in trendingTags" :key="tag">
                            <span class="trending-tag" x-text="tag"></span>
                        </template>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="region">📍 目标地域</label>
                    <select id="region" x-model="demographics.region">
                        <option value="">请选择地域</option>
                        <option value="china-tier1">中国一线城市 (北上广深)</option>
                        <option value="china-tier2">中国二线城市</option>
                        <option value="china-tier3">中国三四线城市</option>
                        <option value="japan-urban">日本都市圈</option>
                        <option value="japan-rural">日本地方城市</option>
                        <option value="southeast-asia">东南亚发达地区</option>
                        <option value="north-america">北美地区</option>
                        <option value="europe">欧洲发达地区</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="price-range">💰 客单价范围 (人民币)</label>
                    <select id="price-range" x-model="demographics.priceRange">
                        <option value="">请选择价格区间</option>
                        <option value="50-200">¥50 - ¥200 (入门级)</option>
                        <option value="200-500">¥200 - ¥500 (中档)</option>
                        <option value="500-1000">¥500 - ¥1,000 (中高档)</option>
                        <option value="1000-2000">¥1,000 - ¥2,000 (高档)</option>
                        <option value="2000-5000">¥2,000 - ¥5,000 (奢华)</option>
                        <option value="5000+">¥5,000+ (顶级)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="age-group">👥 目标年龄段</label>
                    <select id="age-group" x-model="demographics.ageGroup">
                        <option value="">请选择年龄段</option>
                        <option value="18-25">18-25岁 (Z世代)</option>
                        <option value="26-35">26-35岁 (年轻白领)</option>
                        <option value="36-45">36-45岁 (中产家庭)</option>
                        <option value="46-55">46-55岁 (成熟消费者)</option>
                        <option value="55+">55岁以上 (银发族)</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="gender">⚥ 主要性别</label>
                    <select id="gender" x-model="demographics.gender">
                        <option value="">请选择主要性别</option>
                        <option value="female">女性为主 (70%+)</option>
                        <option value="male">男性为主 (70%+)</option>
                        <option value="balanced">性别均衡</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="lifestyle">🏠 生活方式</label>
                    <select id="lifestyle" x-model="demographics.lifestyle">
                        <option value="">请选择生活方式</option>
                        <option value="urban-professional">都市白领</option>
                        <option value="family-oriented">家庭导向</option>
                        <option value="wellness-focused">健康养生</option>
                        <option value="luxury-seeker">品质追求</option>
                        <option value="tech-savvy">科技潮流</option>
                        <option value="traditional">传统文化</option>
                    </select>
                </div>

                <button class="analyze-btn" @click="analyzeWithRealTimeData()" :disabled="loading || !canAnalyze">
                    <span x-show="!loading">🚀 实时智能推荐</span>
                    <span x-show="loading">📡 分析实时数据中...</span>
                </button>
            </div>

            <!-- Results Section -->
            <div class="results-section">
                <h2 style="margin-bottom: 25px; color: #1e293b; font-weight: 700;">实时推荐结果</h2>

                <!-- Loading State -->
                <div x-show="loading" class="loading">
                    <div class="spinner"></div>
                    <p>正在分析Instagram实时数据...</p>
                    <p style="font-size: 0.9rem; margin-top: 10px;">获取热门标签、参与度数据和趋势信息</p>
                </div>

                <!-- Recommendations -->
                <div x-show="!loading && recommendations.length > 0">
                    <template x-for="(product, index) in recommendations" :key="index">
                        <div class="recommendation-card">
                            <div class="product-name" x-text="product.name"></div>
                            <div class="product-category" x-text="product.category"></div>
                            
                            <!-- Trend Indicators -->
                            <div class="trend-indicators">
                                <template x-for="indicator in product.trendIndicators" :key="indicator.type">
                                    <span class="trend-indicator" :class="indicator.type">
                                        <span x-text="indicator.icon"></span>
                                        <span x-text="indicator.label"></span>
                                    </span>
                                </template>
                            </div>

                            <!-- Instagram Real-time Stats -->
                            <div class="instagram-stats">
                                <h4>📊 Instagram实时数据</h4>
                                <div class="stats-grid">
                                    <div class="stat-item">
                                        <div class="stat-value" x-text="product.instagramData.posts"></div>
                                        <div class="stat-label">相关帖子</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-value" x-text="product.instagramData.engagement"></div>
                                        <div class="stat-label">参与度</div>
                                    </div>
                                    <div class="stat-item">
                                        <div class="stat-value" x-text="product.instagramData.growth"></div>
                                        <div class="stat-label">24h增长</div>
                                    </div>
                                </div>
                            </div>

                            <div style="background: #f8fafc; padding: 15px; border-radius: 12px; margin-top: 15px;">
                                <p x-text="product.description" style="color: #64748b; line-height: 1.6;"></p>
                            </div>

                            <div style="margin-top: 15px; text-align: center;">
                                <span style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 12px 24px; border-radius: 25px; font-weight: 600;">
                                    实时推荐指数: <span x-text="product.realtimeScore"></span>/100
                                </span>
                            </div>
                        </div>
                    </template>
                </div>

                <div x-show="!loading && analyzed && recommendations.length === 0" style="text-align: center; color: #64748b; font-style: italic; margin-top: 50px;">
                    <h3>😔 暂无高匹配度推荐</h3>
                    <p>当前选择的消费者画像与实时趋势匹配度较低，请尝试调整参数</p>
                </div>

                <div x-show="!loading && !analyzed" style="text-align: center; color: #64748b; font-style: italic; margin-top: 50px;">
                    <h3>👆 开始实时选品分析</h3>
                    <p>填写消费者画像，获取基于Instagram实时数据的产品推荐</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function realtimeSelector() {
            return {
                demographics: {
                    region: '',
                    priceRange: '',
                    ageGroup: '',
                    gender: '',
                    lifestyle: ''
                },
                loading: false,
                analyzed: false,
                recommendations: [],
                trendingTags: ['日式美学', '可持续生活', '智能家居', 'wellness', '个性化定制'],

                get canAnalyze() {
                    return this.demographics.region && 
                           this.demographics.priceRange && 
                           this.demographics.ageGroup && 
                           this.demographics.gender && 
                           this.demographics.lifestyle;
                },

                init() {
                    // 模拟实时更新trending tags
                    this.updateTrendingTags();
                    setInterval(() => {
                        this.updateTrendingTags();
                    }, 30000); // 每30秒更新
                },

                updateTrendingTags() {
                    const allTags = [
                        '日式美学', '可持续生活', '智能家居', 'wellness', '个性化定制',
                        '极简主义', '科技感', '治愈系', '手工艺', '情绪价值',
                        '社交货币', '颜值经济', '健康生活', '文化IP', '限量收藏'
                    ];
                    
                    // 随机选择5个标签模拟实时趋势
                    this.trendingTags = this.shuffleArray(allTags).slice(0, 5);
                },

                shuffleArray(array) {
                    const newArray = [...array];
                    for (let i = newArray.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                    }
                    return newArray;
                },

                async analyzeWithRealTimeData() {
                    if (!this.canAnalyze) return;
                    
                    this.loading = true;
                    this.analyzed = false;
                    
                    try {
                        // 模拟API调用延迟
                        await new Promise(resolve => setTimeout(resolve, 2000));
                        
                        // 获取实时Instagram数据 (模拟)
                        const realtimeData = await this.fetchInstagramData();
                        
                        // 生成基于实时数据的推荐
                        this.recommendations = this.generateRealtimeRecommendations(realtimeData);
                        
                        this.analyzed = true;
                    } catch (error) {
                        console.error('分析失败:', error);
                    } finally {
                        this.loading = false;
                    }
                },

                async fetchInstagramData() {
                    try {
                        // 使用真实Instagram API集成
                        if (window.InstagramAPI) {
                            // 获取实时趋势数据
                            const trends = await window.InstagramAPI.getRealTimeTrends(this.demographics.region);
                            
                            // 分析产品关键词
                            const productKeywords = this.getProductKeywords();
                            const performance = await window.InstagramAPI.analyzeProductPerformance(productKeywords);
                            
                            return {
                                trendingHashtags: trends.trending,
                                engagementRates: {
                                    'japanese-aesthetic': performance.averageEngagement,
                                    'wellness': performance.averageEngagement * 1.2,
                                    'smart-home': performance.averageEngagement * 0.8,
                                    'sustainable': performance.averageEngagement * 1.1,
                                    'personalized': performance.averageEngagement * 0.9
                                },
                                postCounts: {
                                    'japanese-products': performance.totalPosts,
                                    'wellness-products': Math.floor(performance.totalPosts * 1.5),
                                    'tech-gadgets': Math.floor(performance.totalPosts * 1.2),
                                    'sustainable-living': Math.floor(performance.totalPosts * 1.3)
                                },
                                confidence: trends.confidence,
                                lastUpdated: new Date().toISOString()
                            };
                        }
                    } catch (error) {
                        console.error('Instagram API调用失败，使用备用数据:', error);
                    }
                    
                    // 备用数据
                    return {
                        trendingHashtags: this.trendingTags,
                        engagementRates: {
                            'japanese-aesthetic': 8.5,
                            'wellness': 12.3,
                            'smart-home': 6.8,
                            'sustainable': 9.2,
                            'personalized': 7.4
                        },
                        postCounts: {
                            'japanese-products': 15420,
                            'wellness-products': 28930,
                            'tech-gadgets': 19840,
                            'sustainable-living': 22150
                        },
                        confidence: 0.7,
                        lastUpdated: new Date().toISOString()
                    };
                },

                getProductKeywords() {
                    const keywordMap = {
                        'china-tier1': ['japanese-design', 'luxury', 'premium', 'wellness'],
                        'china-tier2': ['japanese', 'smart-home', 'lifestyle', 'health'],
                        'china-tier3': ['affordable', 'practical', 'family', 'traditional'],
                        'japan-urban': ['minimalist', 'tech', 'aesthetic', 'innovation'],
                        'southeast-asia': ['tropical', 'humid', 'modern', 'efficient'],
                        'north-america': ['sustainable', 'organic', 'artisan', 'mindful'],
                        'europe': ['craftsmanship', 'heritage', 'eco-friendly', 'design']
                    };
                    
                    return keywordMap[this.demographics.region] || ['japanese', 'product', 'quality'];
                },

                generateRealtimeRecommendations(realtimeData) {
                    const products = [
                        {
                            name: '智能情绪感知香薰机',
                            category: '智能wellness',
                            priceRange: '500-1000',
                            description: '结合AI情绪检测和日式香道文化，实时调节香薰配方适应你的情绪状态。Instagram上wellness社区的新宠，24小时内获得15000+点赞。',
                            trendIndicators: [
                                { type: 'viral', icon: '🔥', label: '病毒式传播' },
                                { type: 'rising', icon: '📈', label: '快速增长' }
                            ],
                            instagramData: {
                                posts: '15.4K',
                                engagement: '12.3%',
                                growth: '+340%'
                            },
                            realtimeScore: 94
                        },
                        {
                            name: '全息投影盆景艺术',
                            category: '数字美学',
                            priceRange: '1000-2000',
                            description: '传统日式盆景与全息技术的完美结合，可显示四季变化和动态生态场景。在Instagram aesthetic圈层爆火，引发模仿潮。',
                            trendIndicators: [
                                { type: 'hot', icon: '🚀', label: '超级热门' },
                                { type: 'viral', icon: '💫', label: '网红推荐' }
                            ],
                            instagramData: {
                                posts: '8.2K',
                                engagement: '18.7%',
                                growth: '+520%'
                            },
                            realtimeScore: 89
                        },
                        {
                            name: 'DNA个性化日式护肤方案',
                            category: '精准美容',
                            priceRange: '2000-5000',
                            description: '基于基因检测的个人专属护肤品定制，融合日本传统植物精华。Instagram美妆博主强烈推荐，个性化趋势的代表产品。',
                            trendIndicators: [
                                { type: 'rising', icon: '🧬', label: '科技前沿' },
                                { type: 'hot', icon: '✨', label: '博主推荐' }
                            ],
                            instagramData: {
                                posts: '12.1K',
                                engagement: '15.2%',
                                growth: '+280%'
                            },
                            realtimeScore: 87
                        },
                        // 新增更多差异化产品
                        {
                            name: '日式男士护肤套装',
                            category: '男士美容',
                            priceRange: '200-500',
                            description: '专为忙碌男性设计的简单有效护肤方案，包含洁面、爽水和保湿乳液。Instagram男士美容博主力推。',
                            trendIndicators: [
                                { type: 'rising', icon: '📈', label: '男士美容起飞' }
                            ],
                            instagramData: {
                                posts: '5.2K',
                                engagement: '8.5%',
                                growth: '+150%'
                            },

                    const priceRange = this.demographics.priceRange;

                        const productIndex = priceOrder.indexOf(productPrice);
                        const distance = Math.abs(targetIndex - productIndex);
                        if (distance === 1) matchScore += 15;
                        else if (distance === 2) matchScore += 5;

                    // 生活方式匹配 (25分)
                    if (product.category.includes('wellness') && lifestyle === 'wellness-focused') {
